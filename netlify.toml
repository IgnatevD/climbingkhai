[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA: усі адреси (/about, /en/events/...) віддають index.html, маршрутизацію робить React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Файли з хешем у назві кешуються назавжди — повторні візити миттєві
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
